[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgent"
version = "0.1.0"
description = "Async LLM agent with tool use and Neo4j graph query support"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "neo4j>=5.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
tricentis = [
    "tricentis-ai-client @ ./tricentis-ai-client",
    "anthropic>=0.40",
    "httpx>=0.27",
]
bedrock = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kgent = "main:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kgent", "graph_pipeline"]

[tool.pytest.ini_options]
testpaths = ["kgent/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
markers = [
    "integration: requires live external services like Neo4j (pass --integration to enable)",
    "llm: requires a live LLM (pass --llm to enable)",
]
